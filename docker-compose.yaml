services:
  postgres:
    image: postgres:17.7
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: happy_pet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped
    # -h 127.0.0.1 forces a TCP check: during the first-boot initdb, Postgres
    # runs a temporary server on the unix socket only, which would otherwise
    # report "ready" before the real server accepts connections.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d happy_pet_db -h 127.0.0.1']
      interval: 60s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: happy_pet_db
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/health'')"'
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time — override and rebuild to point the app at
        # a LAN address for testing on a real phone:
        #   API_URL=http://192.168.1.20:8080/api/v1 docker compose up --build frontend
        EXPO_PUBLIC_API_URL: ${API_URL:-http://localhost:8080/api/v1}
    container_name: frontend_app
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
