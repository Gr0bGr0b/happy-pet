# Two profiles:
#   docker compose --profile dev up    hot reload, source mounted from the host
#   docker compose --profile prod up   production images, no reload
#
# Set COMPOSE_PROFILES in .env to pick a default. postgres has no profile, so it
# starts either way.

services:
  postgres:
    image: postgres:17.7
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: happy_pet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped
    # -h 127.0.0.1 forces a TCP check: during the first-boot initdb, Postgres
    # runs a temporary server on the unix socket only, which would otherwise
    # report "ready" before the real server accepts connections.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d happy_pet_db -h 127.0.0.1']
      interval: 60s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---- production ---------------------------------------------------------

  backend:
    profiles: ['prod']
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: happy-pet-backend
    container_name: backend_app
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: happy_pet_db
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/health'')"'
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    profiles: ['prod']
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # Metro inlines EXPO_PUBLIC_* at build time, so pointing the app
        # elsewhere needs a rebuild.
        EXPO_PUBLIC_API_URL: ${API_URL:-http://localhost:8080/api/v1}
    image: happy-pet-frontend
    container_name: frontend_app
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- development --------------------------------------------------------

  backend-dev:
    profiles: ['dev']
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    # Separate tag from the prod image, so building one never overwrites the other.
    image: happy-pet-backend-dev
    container_name: backend_dev
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: happy_pet_db
      # Keep .pyc out of the bind-mounted host tree.
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      # Set to true if reloads are missed because inotify does not cross the mount.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/health'')"'
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend-dev:
    profiles: ['dev']
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: happy-pet-frontend-dev
    container_name: frontend_dev
    ports:
      - '3000:3000'
    depends_on:
      backend-dev:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      # Anonymous volumes: keep the image's Linux node_modules and Expo cache
      # instead of the host's.
      - /app/node_modules
      - /app/.expo
    environment:
      # Read per request by the dev server, so no rebuild needed to change it.
      EXPO_PUBLIC_API_URL: ${API_URL:-http://localhost:8080/api/v1}
      # Without this the CLI tries to open a browser and, because the container
      # shares the host's WSL2 kernel, dies on `spawn cmd.exe ENOENT`.
      BROWSER: none
    restart: unless-stopped
    # Metro's interactive shortcuts need a TTY.
    stdin_open: true
    tty: true

volumes:
  postgres_data:
